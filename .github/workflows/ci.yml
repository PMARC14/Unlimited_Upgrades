# CI for the mod. It deliberately does NOT build or publish the mod:
# compiling needs the game's Assembly-CSharp.dll, which isn't (and can't be)
# in this repo. An earlier workflow tried anyway, ignored the failed build,
# and published release zips with no DLL in them. Instead:
#
#   * every push/PR: check the manifest, versions, icon, and tag agree
#   * every published release: download its zip and fail loudly if the real
#     mod isn't inside
#
# Releases are built on a PC with the game installed — see "Releasing" in
# the README.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check release metadata
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest, versions, icon, and tag
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/check_release.py "$TAG"

  verify-release-asset:
    name: Verify the release zip contains the mod
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download and inspect the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          mkdir assets
          # Assets are attached just after a release is created; give them time.
          for attempt in $(seq 1 18); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir assets 2>/dev/null; then
              break
            fi
            echo "No zip attached to $TAG yet (attempt $attempt/18); waiting 10s..."
            sleep 10
          done

          shopt -s nullglob
          zips=(assets/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::Release $TAG has no .zip asset. Build it with package.ps1, attach dist/*.zip to the release, then re-run this job."
            exit 1
          fi

          status=0
          for zip in "${zips[@]}"; do
            python3 scripts/check_release_asset.py "$zip" "${TAG#v}" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::The release zip is missing the mod. Re-upload one built with package.ps1."
          fi
          exit "$status"
